name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q hishebi-app.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        working-directory: hishebi-app
        run: npm install
      - name: Add Android
        working-directory: hishebi-app
        run: npx cap add android
      - name: Add notification permission
        working-directory: hishebi-app
        run: sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Sync
        working-directory: hishebi-app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: hishebi-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hishebi-apk
          path: hishebi-app/android/app/build/outputs/apk/debug/app-debug.apk
